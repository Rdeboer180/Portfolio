<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LoopStack promo — 10s</title>
<style>
  body { margin: 0; background: #222; display: grid; place-items: center; height: 100vh; }
  canvas { width: 960px; height: 540px; background: #fff; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// LoopStack 10s promo. Deterministic draw(t) — scrub with SEEK(t), record with RECORD().
// Brand tokens from the app's visual system.
const C = {
  ground: '#FAFBFA', surface0: '#FFFFFF', surface1: '#F6F7F8', surface2: '#EDEEF0',
  ink900: '#0E1216', ink700: '#3C434A', ink500: '#7A828A', ink300: '#BEC3CA', ink200: '#E3E5E8',
  brand: '#5CC25C', brandHover: '#48A848', brandSoft: '#E8F6E8',
  brandLight: '#6DCE3F', brandDeep: '#1F7A2E',
  rangeHigh: '#F0B429', rangeLow: '#FC5E5E', veryLow: '#C0392B', veryHigh: '#E07B1F',
  insulin: '#E07B1F',
};
const F = (w, s) => `${w} ${s}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1280, H = 720;
const DUR = 10;

// ---- easing / helpers ----
const clamp01 = (x) => Math.max(0, Math.min(1, x));
// progress of t within [a,b]
const P = (t, a, b) => clamp01((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
// pop: overshoot spring-ish
const pop = (x) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x) * Math.cos(x * 9);

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}
function label(txt, x, y, size, color, tracking = 1.2) {
  ctx.font = F(600, size);
  ctx.fillStyle = color;
  let cx = x;
  for (const ch of txt.toUpperCase()) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + tracking; }
  return cx - x;
}

// ---- brand mark: open loop "C" with three stacked bars (2026 emblem) ----
// Geometry & colors lifted from the canonical Illustrator SVG (viewBox 150):
// ring center (73.4,75.3), mid-radius ~52, thickness ~21, opening ±28° on the
// right; three rounded bars slide out through the opening, brightest on top.
function drawMark(x, y, r, prog) {
  ctx.save();
  // optical centering: bars extend right, so shift the ring left a touch
  ctx.translate(x - r * 0.14, y);
  const s = r / 63;                       // scale SVG units -> canvas
  const midR = 52 * s, thick = 21 * s;
  const GAP = 28 * Math.PI / 180;         // half-angle of the right-side opening
  // ring sweeps closed from the bottom gap edge around to the top gap edge
  const start = GAP, full = 2 * Math.PI - 2 * GAP;
  const sweep = full * easeOut(Math.min(1, prog * 1.25));
  const rg = ctx.createLinearGradient(0, -midR - thick, 0, midR + thick);
  rg.addColorStop(0, '#4dd865'); rg.addColorStop(1, '#5aaa6d');
  ctx.strokeStyle = rg;
  ctx.lineWidth = thick;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.arc(0, 0, midR, start, start + sweep);
  ctx.stroke();
  // bars: x 101.5->138.7, h 7.8, rx 3.9, centers y 66/77.5/89 (SVG coords)
  const bars = [
    [-9.3 * s, ['#43bd58', '#4c8f5c']],
    [ 2.2 * s, ['#39a14b', '#3d734a']],
    [13.7 * s, ['#339043', '#34623f']],
  ];
  const bx = (101.5 - 73.4) * s, bw = 37.1 * s, bh = 7.8 * s;
  bars.forEach(([by, cols], i) => {
    const ip = pop(P(prog, 0.35 + i * 0.14, 0.75 + i * 0.14));
    if (ip <= 0) return;
    const g = ctx.createLinearGradient(0, by - bh, 0, by + bh);
    g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
    ctx.fillStyle = g;
    ctx.globalAlpha = Math.min(1, ip * 1.4);
    // slide out from the ring as they pop
    const w = bw * ip;
    rr(bx, by - bh / 2, w, bh, bh / 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  ctx.restore();
}

function wordmark(x, y, size, alpha) {
  ctx.globalAlpha = alpha;
  ctx.font = F(650, size);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = C.brand;
  ctx.fillText('Loop', x, y);
  const lw = ctx.measureText('Loop').width;
  ctx.fillStyle = C.ink900;
  ctx.fillText('Stack', x + lw, y);
  ctx.globalAlpha = 1;
  return lw + ctx.measureText('Stack').width;
}

function tagline(x, y, size, alpha) {
  ctx.globalAlpha = alpha;
  ctx.textBaseline = 'alphabetic';
  let cx = x;
  for (const word of ['UNDERSTAND', 'ADAPT', 'IMPROVE']) {
    ctx.font = F(600, size);
    ctx.fillStyle = C.ink700;
    ctx.fillText(word, cx, y);
    cx += ctx.measureText(word).width;
    ctx.fillStyle = C.brand;
    ctx.fillText('.', cx, y);
    cx += ctx.measureText('.').width + size * 0.55;
  }
  ctx.globalAlpha = 1;
}

// ---- phone with app UI ----
// screenMode: 'trends' | 'meal'; scrollY animates content
function drawPhone(x, y, scale, screen, t) {
  const pw = 320, ph = 650;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  // shadow + body
  ctx.save();
  ctx.shadowColor = 'rgba(13,20,26,0.18)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  rr(-pw/2, -ph/2, pw, ph, 44); ctx.fillStyle = C.ink900; ctx.fill();
  ctx.restore();
  // screen
  rr(-pw/2+10, -ph/2+10, pw-20, ph-20, 36);
  ctx.fillStyle = C.ground; ctx.fill();
  ctx.save();
  rr(-pw/2+10, -ph/2+10, pw-20, ph-20, 36); ctx.clip();
  ctx.translate(-pw/2+10, -ph/2+10);
  drawAppScreen(pw-20, ph-20, screen, t);
  ctx.restore();
  // notch
  rr(-44, -ph/2+18, 88, 22, 11); ctx.fillStyle = C.ink900; ctx.fill();
  ctx.restore();
}

function statusHeader(w) {
  ctx.font = F(650, 15);
  ctx.fillStyle = C.brand; ctx.fillText('Loop', 18, 58);
  const lw = ctx.measureText('Loop').width;
  ctx.fillStyle = C.ink900; ctx.fillText('Stack', 18 + lw, 58);
  ctx.font = F(400, 11); ctx.fillStyle = C.ink500;
  ctx.fillText('Wed, Jul 22', w - 78, 58);
}

function drawAppScreen(w, h, screen, t) {
  ctx.textBaseline = 'alphabetic';
  statusHeader(w);
  if (screen === 'trends') drawTrendsScreen(w, h, t);
  else drawMealScreen(w, h, t);
}

// Trends: glucose hero + TIR + tiles, elements cascade in with `t` (local 0..1)
function drawTrendsScreen(w, h, t) {
  const m = 14;
  // hero card
  const heroA = easeOut(P(t, 0.05, 0.3));
  if (heroA > 0) {
    ctx.globalAlpha = heroA;
    const hy = 74 + (1 - heroA) * 16;
    rr(m, hy, w - m*2, 118, 18);
    ctx.fillStyle = C.surface0;
    ctx.shadowColor = 'rgba(13,20,26,0.06)'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = C.brand; rr(m, hy, 3.5, 118, 2); ctx.fill();
    label('CURRENT GLUCOSE', m + 16, hy + 26, 9.5, C.ink500);
    // counting number
    const val = Math.round(96 + 46 * easeOut(P(t, 0.1, 0.55)));
    ctx.font = F(650, 42); ctx.fillStyle = C.ink900;
    ctx.fillText(String(val), m + 16, hy + 72);
    ctx.font = F(400, 14); ctx.fillStyle = C.ink500;
    ctx.fillText('mg/dL', m + 16 + ctx.measureText(' ').width + 62, hy + 72);
    ctx.font = F(600, 12); ctx.fillStyle = C.brandHover;
    ctx.fillText('→ steady · in range · just now', m + 16, hy + 98);
    ctx.globalAlpha = 1;
  }
  // TIR card
  const tirA = easeOut(P(t, 0.28, 0.52));
  if (tirA > 0) {
    ctx.globalAlpha = tirA;
    const ty = 208 + (1 - tirA) * 16;
    rr(m, ty, w - m*2, 132, 18);
    ctx.fillStyle = C.surface0;
    ctx.shadowColor = 'rgba(13,20,26,0.06)'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
    label('TIME IN RANGE', m + 16, ty + 26, 9.5, C.ink500);
    const pct = Math.round(74 * easeOut(P(t, 0.34, 0.75)));
    ctx.font = F(650, 38); ctx.fillStyle = C.ink900;
    ctx.fillText(pct + '', m + 16, ty + 66);
    ctx.font = F(500, 18); ctx.fillStyle = C.ink500;
    ctx.fillText('%', m + 20 + ctx.measureText(String(pct)).width + 26, ty + 66);
    ctx.font = F(400, 11); ctx.fillStyle = C.ink500;
    ctx.fillText('70–180 mg/dL', w - m - 96, ty + 66);
    // 5-band bar filling
    const bx = m + 16, bw = w - m*2 - 32, by = ty + 84, bh = 12;
    const fill = easeOut(P(t, 0.38, 0.8));
    rr(bx, by, bw, bh, 6); ctx.fillStyle = C.surface2; ctx.fill();
    const bands = [[1, C.veryLow], [4, C.rangeLow], [74, C.brand], [18, C.rangeHigh], [3, C.veryHigh]];
    let acc = 0;
    ctx.save(); rr(bx, by, bw * fill, bh, 6); ctx.clip();
    for (const [p, col] of bands) {
      ctx.fillStyle = col;
      ctx.fillRect(bx + (acc / 100) * bw, by, (p / 100) * bw - 1, bh);
      acc += p;
    }
    ctx.restore();
    ctx.font = F(500, 10.5); ctx.fillStyle = C.ink500;
    ctx.fillText('1% very low · 4% low · 74% in · 18% high · 3%', bx, by + 32);
    ctx.globalAlpha = 1;
  }
  // metric tiles ×4
  const tiles = [
    ['AVG GLUCOSE', '142', 'mg/dL', '↓ 5'],
    ['EST. A1C', '6.6', '%', '↓ 0.1'],
    ['VARIABILITY', '34', '% CV', '↓ 1'],
    ['EXERCISE', '96', 'min', 'W + HR + steps'],
  ];
  tiles.forEach(([lab, val, unit, delta], i) => {
    const a = easeOut(P(t, 0.5 + i * 0.07, 0.72 + i * 0.07));
    if (a <= 0) return;
    ctx.globalAlpha = a;
    const col = i % 2, row = Math.floor(i / 2);
    const tw = (w - m*2 - 12) / 2;
    const tx = m + col * (tw + 12);
    const ty2 = 356 + row * 106 + (1 - a) * 14;
    rr(tx, ty2, tw, 96, 16);
    ctx.fillStyle = C.surface0;
    ctx.shadowColor = 'rgba(13,20,26,0.06)'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
    label(lab, tx + 13, ty2 + 24, 8.5, C.ink500);
    ctx.font = F(650, 26); ctx.fillStyle = C.ink900;
    ctx.fillText(val, tx + 13, ty2 + 56);
    ctx.font = F(500, 12); ctx.fillStyle = C.ink500;
    ctx.fillText(unit, tx + 17 + ctx.measureText(val).width + 9, ty2 + 56);
    // delta chip
    ctx.font = F(600, 10);
    const dw2 = ctx.measureText(delta).width + 12;
    rr(tx + 13, ty2 + 66, dw2, 18, 9);
    ctx.fillStyle = C.brandSoft; ctx.fill();
    ctx.fillStyle = C.brandHover; ctx.fillText(delta, tx + 19, ty2 + 79);
    ctx.globalAlpha = 1;
  });
}

// Favorite-meal report card screen
function drawMealScreen(w, h, t) {
  const m = 14;
  const a = easeOut(P(t, 0.05, 0.35));
  ctx.globalAlpha = a;
  const cy = 84 + (1 - a) * 20;
  rr(m, cy, w - m*2, 400, 20);
  ctx.fillStyle = C.surface0;
  ctx.shadowColor = 'rgba(13,20,26,0.07)'; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
  label('FAVORITE MEAL', m + 18, cy + 30, 9.5, C.ink500);
  ctx.font = F(650, 22); ctx.fillStyle = C.ink900;
  ctx.fillText('Tofu rice bowl', m + 18, cy + 60);
  // archetype pill
  ctx.font = F(600, 10);
  rr(m + 18, cy + 72, 82, 20, 10); ctx.fillStyle = C.surface2; ctx.fill();
  ctx.fillStyle = C.brandHover; ctx.fillText('FLATTENED', m + 27, cy + 86);
  // confidence ring (fills with t)
  const ringP = easeOut(P(t, 0.25, 0.8));
  const score = Math.round(86 * ringP);
  const rx = w - m - 52, ry = cy + 52, rrad = 26;
  ctx.lineWidth = 5; ctx.strokeStyle = C.surface2;
  ctx.beginPath(); ctx.arc(rx, ry, rrad, 0, 7); ctx.stroke();
  ctx.strokeStyle = C.brand; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(rx, ry, rrad, -Math.PI/2, -Math.PI/2 + ringP * 0.86 * 2 * Math.PI); ctx.stroke();
  ctx.font = F(650, 15); ctx.fillStyle = C.ink900; ctx.textAlign = 'center';
  ctx.fillText(score + '%', rx, ry + 5);
  ctx.font = F(600, 9); ctx.fillStyle = C.brandHover;
  ctx.fillText('READY', rx, ry + rrad + 14);
  ctx.textAlign = 'left';
  // stat row
  const stats = [['1.4U', 'AVG INSULIN'], ['3h', 'DURATION'], ['12', 'TIMES EATEN']];
  rr(m + 18, cy + 106, w - m*2 - 36, 64, 12); ctx.fillStyle = C.surface1; ctx.fill();
  stats.forEach(([v, l], i) => {
    const sx = m + 30 + i * ((w - m*2 - 60) / 3);
    ctx.font = F(650, 20); ctx.fillStyle = C.ink900; ctx.fillText(v, sx, cy + 136);
    label(l, sx, cy + 156, 7.5, C.ink500);
  });
  // outcome bar
  const oy = cy + 190;
  label('OUTCOMES · 12 MEALS', m + 18, oy, 8.5, C.ink500);
  const obx = m + 18, obw = w - m*2 - 36;
  rr(obx, oy + 10, obw, 10, 5); ctx.fillStyle = C.surface2; ctx.fill();
  const fill2 = easeOut(P(t, 0.35, 0.75));
  ctx.save(); rr(obx, oy + 10, obw * fill2, 10, 5); ctx.clip();
  ctx.fillStyle = C.brand; ctx.fillRect(obx, oy + 10, obw * (8/12), 10);
  ctx.fillStyle = C.rangeLow; ctx.fillRect(obx + obw * (8/12), oy + 10, obw * (3/12), 10);
  ctx.fillStyle = C.rangeHigh; ctx.fillRect(obx + obw * (11/12), oy + 10, obw * (1/12), 10);
  ctx.restore();
  ctx.font = F(500, 10.5); ctx.fillStyle = C.ink500;
  ctx.fillText('8 in range · 3 low · 1 high', obx, oy + 38);
  // verdict callout
  const vy = oy + 52;
  rr(m + 18, vy, w - m*2 - 36, 62, 12);
  ctx.fillStyle = '#FDECEC'; ctx.fill();
  ctx.font = F(650, 10); ctx.fillStyle = C.rangeLow;
  ctx.fillText('TOO MUCH · LAST TIME', m + 30, vy + 22);
  ctx.font = F(400, 11.5); ctx.fillStyle = C.ink700;
  ctx.fillText('ran low after hour 4 — the tail overshot', m + 30, vy + 42);
  // handoff CTA
  const hy2 = vy + 78;
  const ctaA = easeOut(P(t, 0.55, 0.8));
  ctx.globalAlpha = a * ctaA;
  rr(m + 18, hy2, 168, 38, 19); ctx.fillStyle = C.brand; ctx.fill();
  ctx.font = F(600, 13); ctx.fillStyle = '#fff';
  ctx.fillText('Add to Fix Log', m + 42, hy2 + 24);
  ctx.font = F(500, 11); ctx.fillStyle = C.ink500;
  ctx.fillText('55g → 50g', m + 200, hy2 + 24);
  ctx.globalAlpha = 1;
}

// ---- side icons: Loop, Apple Health, Watch ----
function iconLoop(x, y, s) {
  ctx.save(); ctx.translate(x, y);
  ctx.lineWidth = s * 0.16; ctx.strokeStyle = C.brand; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, s * 0.5, 0.35 * Math.PI, 2.15 * Math.PI); ctx.stroke();
  // arrowhead
  const a = 2.15 * Math.PI;
  const ax = Math.cos(a) * s * 0.5, ay = Math.sin(a) * s * 0.5;
  ctx.fillStyle = C.brand;
  ctx.beginPath();
  ctx.moveTo(ax + s*0.16, ay - s*0.02); ctx.lineTo(ax - s*0.12, ay - s*0.2); ctx.lineTo(ax - s*0.05, ay + s*0.16);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function iconHeart(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s/24, s/24);
  ctx.fillStyle = C.rangeLow;
  ctx.beginPath();
  ctx.moveTo(0, 7);
  ctx.bezierCurveTo(-1, 4, -4, 0.5, -7.5, 0.5);
  ctx.bezierCurveTo(-12, 0.5, -13, 5, -11.5, 8.2);
  ctx.bezierCurveTo(-9.5, 12.4, -3.5, 16.5, 0, 19);
  ctx.bezierCurveTo(3.5, 16.5, 9.5, 12.4, 11.5, 8.2);
  ctx.bezierCurveTo(13, 5, 12, 0.5, 7.5, 0.5);
  ctx.bezierCurveTo(4, 0.5, 1, 4, 0, 7);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function iconWatch(x, y, s) {
  ctx.save(); ctx.translate(x, y);
  const w2 = s * 0.62, h2 = s * 0.74;
  // straps
  ctx.fillStyle = C.ink300;
  rr(-w2*0.32, -h2*0.78, w2*0.64, h2*0.28, 4); ctx.fill();
  rr(-w2*0.32, h2*0.5, w2*0.64, h2*0.28, 4); ctx.fill();
  // case
  rr(-w2/2, -h2/2, w2, h2, s*0.16); ctx.fillStyle = C.ink900; ctx.fill();
  rr(-w2/2 + 3, -h2/2 + 3, w2 - 6, h2 - 6, s*0.11); ctx.fillStyle = '#111b14'; ctx.fill();
  // tiny glucose curve on the watch face
  ctx.strokeStyle = C.brand; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-w2*0.3, h2*0.12);
  ctx.quadraticCurveTo(-w2*0.1, -h2*0.22, w2*0.05, -h2*0.05);
  ctx.quadraticCurveTo(w2*0.18, h2*0.08, w2*0.3, 0);
  ctx.stroke();
  ctx.restore();
}

// data particles flowing from (sx,sy) to (tx2,ty2)
function flow(sx, sy, tx2, ty2, t, seed, color) {
  for (let i = 0; i < 5; i++) {
    const p = ((t * 0.55 + i * 0.2 + seed) % 1);
    const x = sx + (tx2 - sx) * p;
    const y = sy + (ty2 - sy) * p - Math.sin(p * Math.PI) * 26;
    ctx.globalAlpha = Math.sin(p * Math.PI) * 0.9;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, 3.4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// big confidence ring for scene 4
function bigRing(x, y, r, prog, alpha) {
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 13; ctx.lineCap = 'round';
  ctx.strokeStyle = C.surface2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
  ctx.strokeStyle = C.brand;
  ctx.beginPath(); ctx.arc(x, y, r, -Math.PI/2, -Math.PI/2 + prog * 0.86 * 2 * Math.PI); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = F(650, 54); ctx.fillStyle = C.ink900;
  ctx.fillText(Math.round(86 * prog) + '%', x, y + 12);
  ctx.font = F(600, 15); ctx.fillStyle = C.brandHover;
  ctx.fillText('READY', x, y + r + 34);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

// ---- master timeline ----
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = C.ground; ctx.fillRect(0, 0, W, H);

  // S1 brand open (0–1.5), exits by 1.9
  if (t < 2.0) {
    const inP = P(t, 0, 1.1);
    const outP = P(t, 1.5, 1.9);
    ctx.globalAlpha = 1 - easeInOut(outP);
    const y0 = H/2 - 60 - easeInOut(outP) * 40;
    drawMark(W/2, y0 - 30, 84, easeOut(inP));
    if (t > 0.55) {
      ctx.font = F(650, 56); ctx.textAlign = 'center';
      const a = easeOut(P(t, 0.55, 0.95));
      ctx.globalAlpha = a * (1 - easeInOut(outP));
      ctx.fillStyle = C.brand;
      const full = 'LoopStack';
      ctx.font = F(650, 56);
      const lw = ctx.measureText('Loop').width, sw = ctx.measureText('Stack').width;
      const bx = W/2 - (lw + sw)/2;
      ctx.textAlign = 'left';
      ctx.fillText('Loop', bx, y0 + 110);
      ctx.fillStyle = C.ink900;
      ctx.fillText('Stack', bx + lw, y0 + 110);
    }
    if (t > 0.85) {
      const a = easeOut(P(t, 0.85, 1.2));
      ctx.globalAlpha = a * (1 - easeInOut(outP));
      ctx.font = F(600, 16);
      const tl = 'UNDERSTAND.  ADAPT.  IMPROVE.';
      ctx.textAlign = 'center'; ctx.fillStyle = C.ink500;
      // draw with green periods
      ctx.textAlign = 'left';
      let cx = W/2 - 175;
      for (const word of ['UNDERSTAND', 'ADAPT', 'IMPROVE']) {
        ctx.fillStyle = C.ink700; ctx.fillText(word, cx, y0 + 152);
        cx += ctx.measureText(word).width;
        ctx.fillStyle = C.brand; ctx.fillText('.', cx, y0 + 152);
        cx += ctx.measureText('.').width + 14;
      }
    }
    ctx.globalAlpha = 1;
  }

  if (t < 1.7) return;

  // Phone: slides in at 1.7, stays through 8.6, exits 8.6–9.2
  const phoneIn = easeOut(P(t, 1.7, 2.5));
  const phoneOut = easeInOut(P(t, 8.55, 9.15));
  const phoneX = W * 0.68;
  const phoneY = H/2 + (1 - phoneIn) * H * 0.75 + phoneOut * H * 0.85;
  // screen content: trends 1.7–4.6 (local t), meal 4.6–8.6
  const screen = t < 4.9 ? 'trends' : 'meal';
  const localT = screen === 'trends' ? P(t, 2.0, 4.6) : P(t, 4.95, 7.6);
  // subtle swap flash between screens
  if (phoneIn > 0 && phoneOut < 1) {
    drawPhone(phoneX, phoneY, 0.94, screen, localT);
  }

  // Left column captions
  const lx = 92;

  // S2 captions (2.1–4.7): reads your real data + source icons + flows
  if (t > 2.1 && t < 4.9) {
    const a = easeOut(P(t, 2.1, 2.55)) * (1 - easeInOut(P(t, 4.5, 4.9)));
    ctx.globalAlpha = a;
    label('READS YOUR REAL DATA', lx, 168, 13, C.brandHover, 2);
    ctx.font = F(650, 40); ctx.fillStyle = C.ink900;
    ctx.fillText('Loop · Apple Health', lx, 222);
    ctx.fillText('· Apple Watch', lx, 270);
    ctx.globalAlpha = a;
    // icon row with pills
    const iy = 350;
    const icons = [
      ['Loop', iconLoop], ['Health', iconHeart], ['Watch', iconWatch],
    ];
    icons.forEach(([name, fn], i) => {
      const ia = easeOut(P(t, 2.45 + i * 0.18, 2.8 + i * 0.18)) * a;
      ctx.globalAlpha = ia;
      const ix = lx + 34 + i * 128;
      rr(ix - 34, iy - 34, 68, 68, 20);
      ctx.fillStyle = C.surface0;
      ctx.shadowColor = 'rgba(13,20,26,0.08)'; ctx.shadowBlur = 14; ctx.fill(); ctx.shadowBlur = 0;
      fn(ix, name === 'Health' ? iy - 9 : iy, 34);
      ctx.font = F(600, 12); ctx.fillStyle = C.ink500; ctx.textAlign = 'center';
      ctx.fillText(name, ix, iy + 56);
      ctx.textAlign = 'left';
      // particle flow into phone
      if (t > 2.9) flow(ix + 30, iy, phoneX - 165, H/2 - 40 + i * 46, t, i * 0.33, [C.brand, C.rangeLow, C.ink500][i]);
    });
    ctx.globalAlpha = 1;
  }

  // S3 captions (5.0–7.8): metrics studied — kinetic list
  if (t > 5.0 && t < 8.2) {
    const a = easeOut(P(t, 5.0, 5.4)) * (1 - easeInOut(P(t, 7.8, 8.2)));
    ctx.globalAlpha = a;
    label('STUDIES YOUR PATTERNS', lx, 158, 13, C.brandHover, 2);
    ctx.font = F(650, 38); ctx.fillStyle = C.ink900;
    ctx.fillText('Metrics that earn', lx, 210);
    ctx.fillText('confidence', lx, 256);
    const rows = [
      'Time in range & variability',
      'Meal memory · repeat curves',
      'Insulin timing & absorption',
      'Exercise → glucose response',
    ];
    rows.forEach((r, i) => {
      const ra = easeOut(P(t, 5.5 + i * 0.32, 5.86 + i * 0.32)) * a;
      ctx.globalAlpha = ra;
      const ry = 316 + i * 52;
      ctx.fillStyle = C.brand;
      ctx.beginPath(); ctx.arc(lx + 7, ry - 7, 4.5, 0, 7); ctx.fill();
      ctx.font = F(600, 21); ctx.fillStyle = C.ink700;
      ctx.fillText(r, lx + 26, ry);
    });
    ctx.globalAlpha = 1;
  }

  // S4 (8.0–9.4): big confidence ring takeover on left → center
  if (t > 7.9) {
    const a = easeOut(P(t, 7.9, 8.4)) * (1 - easeInOut(P(t, 9.3, 9.75)));
    const cxr = W/2 + (1 - easeInOut(P(t, 8.55, 9.1))) * (-W * 0.19);
    bigRing(cxr, H/2 - 30, 104, easeOut(P(t, 8.0, 9.0)), a);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = F(650, 27); ctx.fillStyle = C.ink900;
    ctx.fillText('Evidence-gated confidence reports', cxr, H/2 + 168);
    ctx.font = F(400, 15.5); ctx.fillStyle = C.ink500;
    ctx.fillText('Patterns unlock only when enough meals agree', cxr, H/2 + 196);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // S5 end card (9.5–10): brand close, loop-friendly
  if (t > 9.45) {
    const a = easeOut(P(t, 9.45, 9.85));
    ctx.globalAlpha = a;
    drawMark(W/2, H/2 - 88, 66, 1);
    ctx.globalAlpha = a;
    ctx.font = F(650, 44); ctx.textAlign = 'left';
    const lw = ctx.measureText('Loop').width, sw = ctx.measureText('Stack').width;
    const bx = W/2 - (lw + sw)/2;
    ctx.fillStyle = C.brand; ctx.fillText('Loop', bx, H/2 + 30);
    ctx.fillStyle = C.ink900; ctx.fillText('Stack', bx + lw, H/2 + 30);
    ctx.font = F(500, 17); ctx.fillStyle = C.ink700; ctx.textAlign = 'center';
    ctx.fillText('Metabolic intelligence for Type 1.', W/2, H/2 + 66);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

// ---- controls ----
let raf;
window.SEEK = (t) => { cancelAnimationFrame(raf); draw(t); return 'seeked ' + t; };
window.PLAY = () => {
  const t0 = performance.now();
  const loop = () => {
    const t = ((performance.now() - t0) / 1000) % DUR;
    draw(t);
    raf = requestAnimationFrame(loop);
  };
  loop();
  return 'playing';
};
window.RECORD = () => new Promise((resolve) => {
  cancelAnimationFrame(raf);
  const stream = cv.captureStream(30);
  const rec = new MediaRecorder(stream, {
    mimeType: 'video/webm;codecs=vp9',
    videoBitsPerSecond: 5_000_000,
  });
  const chunks = [];
  rec.ondataavailable = (e) => chunks.push(e.data);
  rec.onstop = async () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const buf = await blob.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let bin = '';
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    window.__B64 = btoa(bin);
    resolve('recorded ' + blob.size + ' bytes; base64 length ' + window.__B64.length);
  };
  const t0 = performance.now();
  rec.start();
  const loop = () => {
    const t = (performance.now() - t0) / 1000;
    if (t >= DUR) { draw(DUR - 0.001); rec.stop(); return; }
    draw(t);
    requestAnimationFrame(loop);
  };
  loop();
});
window.GETCHUNK = (i, size) => (window.__B64 || '').slice(i * size, (i + 1) * size);
draw(0.0);
</script>
