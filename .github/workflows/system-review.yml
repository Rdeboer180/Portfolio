# System review: on every pull request, inventory the system on main and on
# the PR (scripts/system-catalog.mjs), diff the two (scripts/system-review.mjs)
# and post the suggestions as one comment that updates on every push. It
# reports and never fails the check: a person decides what the system takes.
name: System review

on:
  pull_request:
    paths:
      - 'src/components/**'
      - 'src/styles/**'
      - 'scripts/system/**'

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Inventory main and the PR
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          node scripts/system-catalog.mjs "$RUNNER_TEMP/base" "$RUNNER_TEMP/base.json"
          node scripts/system-catalog.mjs . "$RUNNER_TEMP/head.json"

      - name: Write the review
        run: |
          node scripts/system-review.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/review.md"
          cat "$RUNNER_TEMP/review.md" >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, found by its marker and edited in place. A fork's
      # token can't comment, so the step summary above is the fallback.
      - name: Post or update the comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- system-review -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@"$RUNNER_TEMP/review.md" > /dev/null
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/review.md"
          fi
