<title>The Working Drawing</title>
<style>
  :root {
    --signal: #f03d01;
    --signal-muted: #f07654;
    --signal-md: #f9c4b0;
    --signal-light: #fdede9;
    --ink: #1b1b1b;
    --steel: #8f9daf;
    --paper: #ffffff;
    --wall: #f5f5f5;
    --floor: #eef1f4;
    --screen: #22282e;
    --wood: #fbf3ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #101318; color: #d6dce4;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 24px 16px 48px;
  }
  .bar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 14px;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  }
  .bar button {
    font: inherit; color: #d6dce4; background: #1a1f26; border: 1px solid #2c333d;
    padding: 6px 12px; cursor: pointer;
  }
  .bar button.on { color: var(--signal); border-color: var(--signal); }
  .stage {
    position: relative; width: min(1280px, 96vw); aspect-ratio: 4 / 3;
    border: 1px solid #2c333d; overflow: hidden; touch-action: none;
    background: #000;
  }
  .stage img, .stage .plate-wrap {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  .stage img { object-fit: cover; user-select: none; -webkit-user-drag: none; }
  .plate-wrap svg { width: 100%; height: 100%; display: block; background: var(--paper); }

  .stage[data-mode="compare"] .plate-wrap { clip-path: inset(0 0 0 var(--cut, 50%)); }
  .stage[data-mode="onion"]   .plate-wrap { opacity: .55; }
  .stage[data-mode="drawing"] img { visibility: hidden; }
  .stage[data-mode="photo"]   .plate-wrap { visibility: hidden; }

  .divider {
    position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 0;
    border-left: 2px solid var(--signal); z-index: 3; pointer-events: none;
  }
  .divider::after {
    content: "◂ ▸"; position: absolute; top: 50%; left: 0;
    transform: translate(-50%, -50%);
    background: var(--signal); color: #fff; font-size: 11px;
    padding: 5px 7px; border-radius: 99px; white-space: nowrap;
  }
  .stage:not([data-mode="compare"]) .divider { display: none; }
  .hint { margin-top: 12px; font-size: 11px; color: #718095; letter-spacing: .06em; }
</style>

  stage.addEventListener('pointerdown', function (e) {
    if (stage.dataset.mode !== 'compare') return;
    dragging = true; stage.setPointerCapture(e.pointerId); move(e);
  });
  stage.addEventListener('pointermove', function (e) { if (dragging) move(e); });
  stage.addEventListener('pointerup', function () { dragging = false; });
  function move(e) {
    var r = stage.getBoundingClientRect();
    setCut(((e.clientX - r.left) / r.width) * 100);
  }
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') setCut(cut - 2);
    if (e.key === 'ArrowRight') setCut(cut + 2);
