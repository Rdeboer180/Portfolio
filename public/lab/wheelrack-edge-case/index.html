<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Experience Systems Lab</title>
<meta name="rd-teardown" content="2027-01-31">
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--ink:#1b1b1b;--slate:#4a4a4a;--graphite:#707070;--hair:#e5e5e5;--orange:#f03d01;--orange-deep:#c23001;--cool:#f4f6f7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--cool);color:var(--ink);font:400 16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;-webkit-font-smoothing:antialiased}
.gate{width:100%;max-width:400px;background:#fff;border:1px solid var(--hair);border-radius:14px;padding:28px 26px}
.gate[hidden],.load[hidden]{display:none}
.mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--ink);color:#fff;font:800 12px/1 -apple-system,sans-serif}
h1{font-size:24px;line-height:1.2;letter-spacing:-.01em;margin:16px 0 6px}
p{margin:0;color:var(--slate)}
label{display:block;font-weight:600;font-size:14px;margin:20px 0 6px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid #c9ced3;border-radius:9px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button{margin-top:12px;width:100%;font:600 15px/1 inherit;font-family:inherit;color:#fff;background:var(--ink);border:0;border-radius:9px;padding:13px 14px;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.err{min-height:22px;margin-top:10px;font-size:14px;color:#b3261e}
.load{font-size:14px;color:var(--graphite)}
</style>
</head>
<body>
<p class="load" id="load" hidden>Opening…</p>
<main class="gate" id="gate" hidden>
  <span class="mark" aria-hidden="true">RD</span>
  <h1>Experience Systems Lab</h1>
  <p id="lede">Ryan DeBoer's working demos. Use the portfolio password.</p>
  <form id="form">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Open</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
(() => {
  const SALT = 'RGF9xJIXobQID+HH3YTFwg==', ITER = 250000, BIN = 'index.bin', STORE = 'rd-lab-key';
  const RETIRED = Date.now() > new Date('2027-01-31T23:59:59-05:00').getTime();
  const $ = id => document.getElementById(id);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const store = { get() { try { return localStorage.getItem(STORE); } catch { return null; } }, set(v) { try { localStorage.setItem(STORE, v); } catch {} }, clear() { try { localStorage.removeItem(STORE); } catch {} } };
  let payload = null;
  const getPayload = () => payload || (payload = fetch(BIN, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('missing'); return r.arrayBuffer(); }));
  async function open(rawKey) {
    const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    const buf = new Uint8Array(await getPayload());
    const plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(0, 12) }, key, buf.subarray(12)));
    const n = new DataView(plain.buffer).getUint32(0);
    const man = JSON.parse(new TextDecoder().decode(plain.subarray(4, 4 + n)));
    let html = man.html; const base = 4 + n;
    for (const a of man.assets) {
      const url = URL.createObjectURL(new Blob([plain.subarray(base + a.off, base + a.off + a.len)], { type: a.type }));
      html = html.split('__RDA_' + a.k + '__').join(url);
    }
    return html;
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  async function derive(pw) {
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, k, 256);
  }
  function ask() { $('load').hidden = true; $('gate').hidden = false; $('pw').focus(); }
  $('form').addEventListener('submit', async e => {
    e.preventDefault(); $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'Opening…';
    try {
      const raw = await derive($('pw').value);
      const html = await open(raw);
      store.set(toB64(raw)); show(html);
    } catch (err) {
      $('go').disabled = false; $('go').textContent = 'Open';
      $('err').textContent = err && err.message === 'missing' ? "This page didn't load. Try again in a moment." : "That password didn't work.";
      $('pw').select();
    }
  });
  if (RETIRED) {
    store.clear(); $('load').hidden = true; $('gate').hidden = false;
    $('lede').innerHTML = 'This page was retired on 2027-01-31. The current work is at <a href="https://www.rdeboerdesigns.com/">rdeboerdesigns.com</a>.';
    $('form').hidden = true; return;
  }
  const saved = store.get();
  if (saved) { $('load').hidden = false; open(b64(saved)).then(show, () => { store.clear(); ask(); }); }
  else ask();
})();
</script>
</body>
</html>
